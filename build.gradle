plugins {
    id 'java'
}


java {
    apply plugin: 'java'
    sourceCompatibility = 21
    targetCompatibility = 21
}

group = 'ru.worktech'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation group: 'org.testng', name: 'testng', version: '7.11.0'
    implementation 'io.rest-assured:rest-assured:5.3.0'  //Основная библиотека -- отправляем запросы, получаем ответы, проверяем статус-коды, извлекаем данные из JSON.
    implementation 'io.rest-assured:json-schema-validator:5.3.0'  //Доп. библиотека, проверяем соответсвует ли структура json ожидаемой схеме
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'  // Преобразуем json ответы API в Java объект
    compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.36'
    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.36'
    implementation 'org.aeonbits.owner:owner:1.0.12' //
    implementation group: 'org.hamcrest', name: 'hamcrest', version: '3.0'
    implementation 'io.qameta.allure:allure-testng:2.20.1'
    implementation 'io.qameta.allure:allure-selenide:2.20.1'
    implementation 'io.qameta.allure:allure-commandline:2.20.1'
    implementation 'io.qameta.allure:allure-assertj:2.20.1'
    implementation 'io.qameta.allure:allure-rest-assured:2.20.1'
    implementation 'io.qameta.allure:allure-java-commons:2.20.1'
}

test {
    useTestNG()
}